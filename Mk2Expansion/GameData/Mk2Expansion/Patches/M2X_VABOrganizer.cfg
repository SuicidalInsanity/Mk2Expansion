/// VABOrganizer subcategory patches for mk2 stockalike expansion

/////////////// Aero parts //////////////////////

/// Don't need to patch M2X_InlineIntake or M2X_AeroIntake bc
/// VABOrganizer actually detects them itself.
@PART[M2X_*intake|M2X_Shockcone]:NEEDS[VABOrganizer&Mk2Expansion]
{
    %VABORGANIZER
    {
        %organizerSubcategory = intakes
    }
}
@PART[M2X_Precooler]:NEEDS[VABOrganizer&Mk2Expansion]
{
    %VABORGANIZER
    {
        %organizerSubcategory = airAccessories
    }
}
@PART[M2X_EngineShroud]:NEEDS[VABOrganizer&Mk2Expansion]
{
    %VABORGANIZER
    {
        %organizerSubcategory = engineMount
    }
}
@PART[M2X_*Nose]:NEEDS[VABOrganizer&Mk2Expansion]
{
    %VABORGANIZER
    {
        %organizerSubcategory = noses
    }
}

